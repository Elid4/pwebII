<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::head},~{::main})}">
<head th:replace="~{fragments/head :: head('Clínica Amrita')}"></head>

<body>
<main class="container py-5">

    <div class="row justify-content-center">
        <div class="col-sm-8 col-md-6 col-lg-4">

            <div th:if="${param.error}" class="alert alert-danger">
                Usuário ou senha inválidos.
            </div>

            <div th:if="${param.logout}" class="alert alert-success">
                Você saiu do sistema.
            </div>

            <div class="card shadow-sm">

                <div class="card-header text-center py-4">
                    <h1 class="h4 mb-2 text-white">Bem-vindo à Amrita</h1>
                    <p class="mb-0" style="color: var(--amrita-gold-light)">
                        Cuidar é a nossa essência.
                    </p>
                </div>

                <div class="card-body p-4">

                    <form th:action="@{/login}" method="post">

                        <div class="mb-3">
                            <label for="username" class="form-label">
                                Usuário
                            </label>
                            <input id="username" name="username"
                                   class="form-control"
                                   placeholder="Digite seu usuário"
                                   required autofocus
                                   autocomplete="username">
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">
                                Senha
                            </label>
                            <input id="password" name="password"
                                   type="password"
                                   class="form-control"
                                   placeholder="Digite sua senha"
                                   required
                                   autocomplete="current-password">
                        </div>

                        <div class="form-check mb-4">
                            <input id="remember-me" name="remember-me"
                                   type="checkbox" class="form-check-input">
                            <label for="remember-me" class="form-check-label">
                                Lembrar de mim
                            </label>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Entrar
                        </button>

                        <a href="/paciente/form">Cadastrar-se</a>

                    </form>

                </div>
            </div>

        </div>
    </div>

</main>
</body>
</html>
