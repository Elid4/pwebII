<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::head},~{::main})}">
<head th:replace="~{fragments/head :: head('Médico | Amrita')}"></head>
<head>
    <meta charset="UTF-8">
    <title>Médicos</title>
</head>
<body>
<main>
<h2>Médicos</h2>
        <a th:href="@{/medico/form}" class="amrita-link">
            <i class="bi bi-plus-lg"></i>
            Novo médico
        </a>
    <div class="table-responsive">
<table  class="table table-hover align-middle amrita-table">
    <thead>
    <tr>
        <th>Id</th>
        <th>Nome</th>
        <th>CPF</th>
        <th>Data Nasc.</th>
        <th>E-mail</th>
        <th>Telefone</th>
        <th>CRM</th>
        <th class="td-acao">Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="m : ${medicos}">
        <td th:text="${m.id}"></td>
        <td th:text="${m.nome}"></td>
        <td th:text ="${m.cpf}"></td>
        <td th:text="${m.dataNascimento}"></td>
        <td th:text="${m.email}"></td>
        <td th:text="${m.telefone}"></td>
        <td th:text="${m.crm}"></td>
<td class="td-acao">
    <div class="amrita-actions">
            <a th:href="@{/medico/form(id=${m.id})}"
               class="amrita-action edit"
               title="Editar médico">
                <i class="bi bi-pencil-square"></i>
            </a>

            <a onclick="return window.confirm('Tem certeza que deseja excluir este registro?')"
               th:href="@{/medico/remove(id=${m.id})}"
               class="amrita-action delete"
               title="Excluir médico">
                <i class="bi bi-trash3"></i>
            </a>

            <a th:href="@{/consulta/medico/{id}(id=${m.id})}"
               class="amrita-action view"
               title="Visualizar médico">
                <i class="bi bi-eye"></i>
            </a>
        </div>
        </td>
    </tr>
    </tbody>
</table>
</div>
</main>
</body>


</html>
