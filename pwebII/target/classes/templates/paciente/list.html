<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::head},~{::main})}">
<head th:replace="~{fragments/head :: head('Paciente | Amrita')}"></head>
<head>
    <meta charset="UTF-8">
    <title>Pacientes</title>
</head>
<body>
<main>
<h2>Pacientes</h2>

<a th:href="@{/paciente/form}"  class="amrita-link">
    <i class="bi bi-plus-lg"></i>
    Novo Paciente
</a>

<div class="table-responsive">
    <table  class="table table-hover align-middle amrita-table">
    <thead>
    <tr>
        <th>Id</th>
        <th>Nome</th>
        <th>CPF</th>
        <th>Data de Nasc.</th>
        <th>E-mail</th>
        <th>Telefone</th>
        <th class="td-acao">Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p : ${pacientes}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.nome}"></td>
        <td th:text ="${p.cpf}"></td>
        <td th:text="${p.dataNascimento}"></td>
        <td th:text="${p.email}"></td>
        <td th:text="${p.telefone}"></td>
        <td class="td-acao">
            <a th:href="@{/paciente/form(id=${p.id})}" class="amrita-action edit"
             title="Editar peciente">
                <i class="bi bi-pencil-square"></i>
            </a>

            <a onclick="return window.confirm('Tem certeza que deseja excluir este registro?')"
               th:href="@{/paciente/remove(id=${p.id})}"
               class="amrita-action delete"
               title="Excluir paciente">
                <i class="bi bi-trash3"></i>
            </a>

            <a th:href="@{/consulta/paciente/{id}(id=${p.id})}" class="amrita-action view"
               title="Visualizar paciente">
                <i class="bi bi-eye"></i>
            </a>
        </td>
    </tr>
    </tbody>
</table>
</div>
<br>
</main>
</body>
</html>
