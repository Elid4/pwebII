<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::head},~{::main})}">
<head th:replace="~{fragments/head :: head(${medico.id == null} ? 'Cadastrar Médicos | Amrita' : 'Editar Médico | Amrita')}"></head>
<body>
<main>
<h2>Cadastro de Médico</h2>

<div class="amrita-form">
<form novalidate th:action="@{/medico/save}" th:object="${medico}" method="post">

    <div th:if="${#fields.hasAnyErrors()}"
         class="amrita-error-box">
        <i class="bi bi-exclamation-circle"></i>

        <div>
            <strong>Verifique os dados informados</strong>

            <ul>
                <li th:each="erro : ${#fields.allErrors()}"
                    th:text="${erro}">
                </li>
            </ul>
        </div>
    </div>

    <input type="hidden" th:field="*{id}">

    <div class="mb-3">
        <label for="nome" class="form-label">Nome:</label>
        <input type="text" id="nome" th:field="*{nome}" class="form-control" required>
    </div>

    <div class="mb-3">
        <label for="cpf" class="form-label">CPF:</label>
        <input type="text" id="cpf" th:field="*{cpf}"
               class="form-control" placeholder="Apenas números"
               maxlength="14" required>
    </div>

    <div class="mb-3">
        <label for="dataNascimento" class="form-label">Data de nascimento:</label>
        <input type="date" id="dataNascimento" th:field="*{dataNascimento}"
               class="form-control" required>
    </div>

    <div class="mb-3">
        <label for="telefone" class="form-label">Telefone:</label>
        <input type="tel" id="telefone" th:field="*{telefone}"
               class="form-control" placeholder="(63) 99999-9999"
               maxlength="15" required>
    </div>

    <div class="mb-3">
        <label for="email" class="form-label">E-mail:</label>
        <input type="email" id="email" th:field="*{email}"
               class="form-control" placeholder="exemplo@email.com"
               required>
    </div>

    <div class="mb-3">
        <label for="crm" class="form-label">CRM:</label>
        <input type="text" id="crm" th:field="*{crm}" class="form-control" required>
    </div>

    <div class="amrita-form-actions">
        <button type="submit"  class="btn amrita-btn-save">Salvar</button>
        <a th:href="@{/medico/list}" class="btn amrita-btn-delete">Cancelar</a>
    </div>

</form>
</div>
</main>
</body>
</html>
