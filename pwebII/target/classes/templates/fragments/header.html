<header class="container-fluid p-0" th:fragment="header" xmlns:sec="http://www.w3.org/1999/xhtml">

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">

            <a class="navbar-brand" th:href="@{/}">
                <img src="/assets/img/logo.png" alt=" Logo da Clínica Amrita.">
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent"
                    aria-controls="navbarSupportedContent"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">

                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link active"
                           aria-current="page"
                           th:href="@{/}">
                            Início
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" sec:authorize="hasAnyRole('SECRETARIO', 'ADMIN')"
                           th:href="@{/paciente/list}">
                            Pacientes
                        </a>
                    </li>

                    <li class="nav-item" sec:authorize="hasAnyRole('SECRETARIO', 'ADMIN')">
                        <a class="nav-link"
                           th:href="@{/medico/list}">
                            Médicos
                        </a>
                    </li>

                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link"
                           th:href="@{/consulta/list}">
                            Consultas
                        </a>
                    </li>

                </ul>

                <div class="d-flex align-items-center gap-4">

                    <span sec:authorize="isAuthenticated()">
                        Olá, <strong sec:authentication="name">usuário</strong>
                    </span>

                    <form th:action="@{/logout}" method="post"
                          sec:authorize="isAuthenticated()">
                        <button type="submit" class="amrita-link">
                            <i class="bi bi-box-arrow-right"></i>
                            Sair
                        </button>
                    </form>

                </div>

            </div>
        </div>
    </nav>

</header>
