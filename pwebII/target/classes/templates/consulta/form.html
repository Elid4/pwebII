<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::head},~{::main})}">
<head th:replace="~{fragments/head :: head(${consulta.id == null} ? 'Cadastrar Consultas | Amrita' : 'Editar Consulta | Amrita')}"></head>

<body>
<main>

<h2>Cadastro de Consulta</h2>
<p th:if="${mensagem != null}" th:text="${mensagem}"></p>

<div class="amrita-form">
    <form novalidate th:action="@{/consulta/save}" th:object="${consulta}" method="post">

        <div th:if="${#fields.hasAnyErrors()}"
             class="amrita-error-box">
            <i class="bi bi-exclamation-circle"></i>

            <div>
                <strong>Verifique os dados informados</strong>

                <ul>
                    <li th:each="erro : ${#fields.allErrors()}"
                        th:text="${erro}">
                    </li>
                </ul>
            </div>
        </div>

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label for="medico" class="form-label">Médico:</label>
            <select id="medico" th:field="*{medico.id}" class="form-select" required>
                <option value="">Selecione...</option>
                <option th:each="m : ${medicos}"
                        th:value="${m.id}"
                        th:text="${m.nome}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label for="paciente" class="form-label">Paciente:</label>
            <select id="paciente" th:field="*{paciente.id}" class="form-select" required>
                <option value="">Selecione...</option>
                <option th:each="p : ${pacientes}"
                        th:value="${p.id}"
                        th:text="${p.nome}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label for="data" class="form-label">Data:</label>
            <input type="date" id="data" th:field="*{data}"  class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="valor" class="form-label">Valor:</label>
            <input type="number" id="valor" th:field="*{valor}" step="0.01" min="0"  class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="observacao" class="form-label">Observação:</label>
            <textarea id="observacao" th:field="*{observacao}" class="form-control"></textarea>
        </div>

        <div class="amrita-form-actions">
            <button type="submit" class="btn amrita-btn-save">
                Salvar
            </button>

            <a th:href="@{/consulta/list}" class="btn amrita-btn-delete">
                Cancelar
            </a>
        </div>

    </form>
</div>
</main>
</body>
</html>
